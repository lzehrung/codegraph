[package]
name = "codegraph-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.4.0", default-features = false, features = ["napi8"] }
napi-derive = "3.3.0"
streaming-iterator = "0.1.9"
tree-sitter = "0.25.10"
tree-sitter-c = "0.24.1"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.0"
tree-sitter-sequel = "0.3.11"
tree-sitter-svelte-next = "0.1.1"
tree-sitter-swift = "0.7.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1.2"
arborium-c-sharp = "2.16.0"
arborium-scss = "2.16.0"
arborium-vue = "2.16.0"
unicode-ident = "=1.0.14"

[dev-dependencies]
napi = { version = "3.4.0", default-features = false, features = ["napi8", "noop"] }
napi-derive = { version = "3.3.0", features = ["noop"] }

[build-dependencies]
napi-build = "2.1.5"
