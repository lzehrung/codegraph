name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm run security:production

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Native tests
        run: npm run test:native

      - name: Coverage
        run: npm run test:coverage

      - name: Check fixture cleanliness
        run: npm run fixtures:check-clean

      - name: Native benchmark smoke
        run: npm run bench:native:smoke -- --json
  build-and-test-source:
    name: Source lane (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.16.0
          - os: macos-latest
            node: 24.10.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Security, lint, and format
        run: |
          npm run security:production
          npm run lint
          npm run format:check

      - name: Build
        run: npm run build

      - name: Integration tests
        run: npm run test:integration

      - name: Fixture cleanliness
        run: npm run fixtures:check-clean

      - name: Native benchmark smoke
        run: npm run bench:native:smoke -- --json
      - name: Benchmark and native contract tests
        run: npm run test:contracts

  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Security, lint, and format
        run: |
          npm run security:production
          npm run lint
          npm run format:check

      - name: Build
        run: npm run build

      - name: Fixture cleanliness
        run: npm run fixtures:check-clean

      - name: Native benchmark smoke
        run: npm run bench:native:smoke -- --json

      - name: Native tests
        run: npm run test:native

      - name: Integration tests
        run: npm run test:integration

      - name: Path identity and disk-cache regression tests
        run: >
          npx vitest run
          tests/cache-invalidation.test.ts
          tests/path-normalization.test.ts
          tests/node-modules-and-paths.test.ts
          tests/cache-modes.test.ts
          tests/disk-cache-sqlite.test.ts
          tests/disk-cache-concurrency.test.ts

  windows-node24-cli-teardown:
    name: Windows Node 24 CLI teardown
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: First and warm explore process exit
        run: npx vitest run tests/cli-process-teardown.test.ts tests/windows-process-drain.test.ts
