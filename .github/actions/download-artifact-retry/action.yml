name: Download artifact with retries
description: Download a GitHub Actions artifact, retrying transient DNS and network failures.
inputs:
  name:
    description: Artifact name to download; leave empty to use pattern
    default: ""
  path:
    description: Destination directory
    required: true
  pattern:
    description: Artifact name pattern used when name is empty
    default: ""
  merge-multiple:
    description: Whether multiple matching artifacts are merged into path
    default: "false"
runs:
  using: composite
  steps:
    - name: Download named artifact (attempt 1)
      id: named1
      if: ${{ !cancelled() && inputs.name != '' }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
    - name: Download matching artifacts (attempt 1)
      id: pattern1
      if: ${{ !cancelled() && inputs.name == '' }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
    - name: Wait before artifact download retry
      if: ${{ !cancelled() && (steps.named1.outcome == 'failure' || steps.pattern1.outcome == 'failure') }}
      shell: bash
      run: sleep 20
    - name: Download named artifact (attempt 2)
      id: named2
      if: ${{ !cancelled() && steps.named1.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
    - name: Download matching artifacts (attempt 2)
      id: pattern2
      if: ${{ !cancelled() && steps.pattern1.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
    - name: Wait before final artifact download retry
      if: ${{ !cancelled() && (steps.named2.outcome == 'failure' || steps.pattern2.outcome == 'failure') }}
      shell: bash
      run: sleep 20
    - name: Download named artifact (attempt 3)
      if: ${{ !cancelled() && steps.named2.outcome == 'failure' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
    - name: Download matching artifacts (attempt 3)
      if: ${{ !cancelled() && steps.pattern2.outcome == 'failure' }}
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
