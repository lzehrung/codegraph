name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm run security:production

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:all

      - name: Check fixture cleanliness
        run: npm run fixtures:check-clean

      - name: Semantic corpus release tier
        run: npm run bench:semantic -- --tier release --mode native --mode reduced --package-mode checkout --output semantic-release-results.json

      - name: Native benchmark smoke
        run: npm run bench:native:smoke -- --json
