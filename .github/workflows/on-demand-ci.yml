name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm run security:production

      - name: Check change records
        run: npm run changes:check

      - name: Check inline language checks
        run: npm run language-checks:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        env:
          CFLAGS_x86_64_unknown_linux_gnu: -march=x86-64
          CXXFLAGS_x86_64_unknown_linux_gnu: -march=x86-64
        run: npm run build

      - name: Check x86-64 native CPU baseline
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          node scripts/check-native-cpu-baseline.mjs \
            --addon packages/codegraph-native/index.linux-x64-gnu.node \
            --build-dir packages/codegraph-native/target/x86_64-unknown-linux-gnu/release/build

      - name: SandyBridge GNU parse/query smoke
        shell: bash
        run: |
          docker run --rm --volume "$PWD:/work:ro" --workdir /work \
            node:24.10.0-bookworm-slim@sha256:b8d2197aff9129d16c801a3e3e1b2a873c4946480f5a310f38056df2268c38d9 sh -ec '
              apt-get update && apt-get install -y --no-install-recommends qemu-user=1:7.2+dfsg-7+deb12u18+b3
              qemu-x86_64 -cpu SandyBridge /usr/local/bin/node \
                scripts/native-cpu-smoke.cjs packages/codegraph-native/index.linux-x64-gnu.node'

      - name: Native tests
        run: npm run test:native

      - name: Coverage
        run: npm run test:coverage

      - name: Check fixture cleanliness
        run: npm run fixtures:check-clean

      - name: Check fixture matrix snapshot
        run: npm run bench:fixtures:check

      - name: Check graph edge snapshot
        run: npm run graph:snapshot:check

      - name: Check answer snapshot
        run: npm run answers:snapshot:check

      - name: Native benchmark smoke
        run: npm run bench:native:smoke -- --json
  build-and-test-source:
    name: Source lane (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.16.0
          - os: macos-latest
            node: 24.10.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Security, lint, and format
        run: |
          npm run security:production
          npm run lint
          npm run format:check

      - name: Build
        env:
          CFLAGS_x86_64_unknown_linux_gnu: -march=x86-64
          CXXFLAGS_x86_64_unknown_linux_gnu: -march=x86-64
          CFLAGS_x86_64_apple_darwin: -march=x86-64
          CXXFLAGS_x86_64_apple_darwin: -march=x86-64
        run: npm run build

      - name: Check x86-64 native CPU baseline
        if: runner.arch == 'X64'
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          suffix="$(node --input-type=module -e 'import { nativeTargetSuffixForPlatform as suffix } from "./packages/codegraph-native/platform.js"; console.log(suffix(process.platform, process.arch, "gnu"))')"
          host="$(rustc -vV | awk '/^host:/ {print $2}')"
          node scripts/check-native-cpu-baseline.mjs \
            --addon "packages/codegraph-native/index.$suffix.node" \
            --build-dir "packages/codegraph-native/target/$host/release/build"

      - name: Check answer snapshot
        run: npm run answers:snapshot:check

      - name: Answer snapshot Unicode path regression tests
        if: matrix.os == 'macos-latest'
        run: npx vitest run tests/answer-snapshot.test.ts

      - name: Integration tests
        run: npm run test:integration

      - name: Fixture cleanliness
        run: npm run fixtures:check-clean

      - name: Native benchmark smoke
        run: npm run bench:native:smoke -- --json
      - name: Benchmark and native contract tests
        run: npm run test:contracts

  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Security, lint, and format
        run: |
          npm run security:production
          npm run lint
          npm run format:check

      - name: Build
        env:
          CFLAGS_x86_64_pc_windows_msvc: /arch:SSE2
          CXXFLAGS_x86_64_pc_windows_msvc: /arch:SSE2
        run: npm run build

      - name: Check x86-64 native CPU baseline
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          node scripts/check-native-cpu-baseline.mjs \
            --addon packages/codegraph-native/index.win32-x64-msvc.node \
            --build-dir packages/codegraph-native/target/x86_64-pc-windows-msvc/release/build

      - name: Check answer snapshot
        run: npm run answers:snapshot:check

      - name: Fixture cleanliness
        run: npm run fixtures:check-clean

      - name: Native benchmark smoke
        run: npm run bench:native:smoke -- --json

      - name: Native tests
        run: npm run test:native

      - name: Integration tests
        run: npm run test:integration

      - name: Path identity and disk-cache regression tests
        run: >
          npx vitest run
          tests/cache-invalidation.test.ts
          tests/path-normalization.test.ts
          tests/node-modules-and-paths.test.ts
          tests/cache-modes.test.ts
          tests/disk-cache-sqlite.test.ts
          tests/disk-cache-concurrency.test.ts

  windows-node24-cli-teardown:
    name: Windows Node 24 CLI teardown
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        env:
          CFLAGS_x86_64_pc_windows_msvc: /arch:SSE2
          CXXFLAGS_x86_64_pc_windows_msvc: /arch:SSE2
        run: npm run build

      - name: Check x86-64 native CPU baseline
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          node scripts/check-native-cpu-baseline.mjs \
            --addon packages/codegraph-native/index.win32-x64-msvc.node \
            --build-dir packages/codegraph-native/target/x86_64-pc-windows-msvc/release/build

      - name: Check answer snapshot
        run: npm run answers:snapshot:check

      - name: First and warm explore process exit
        run: npx vitest run tests/cli-process-teardown.test.ts tests/windows-process-drain.test.ts
